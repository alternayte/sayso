{{- if .Values.relay.enabled }}
# The public relay: no database, no volume, read-only root filesystem (SI-15).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sayso.name" . }}-relay
  labels:
    {{- include "sayso.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  replicas: {{ .Values.relay.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        {{- include "sayso.labels" . | nindent 8 }}
        app.kubernetes.io/component: relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: relay
          image: {{ include "sayso.image" . }}
          args: ["serve", "--role", "relay"]
          env:
            - name: SAYSO_RELAY_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: SAYSO_RELAY_TOKEN } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          securityContext:
            {{- include "sayso.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sayso.name" . }}-relay
  labels:
    {{- include "sayso.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: relay
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- if .Values.relay.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sayso.name" . }}-relay
  labels:
    {{- include "sayso.labels" . | nindent 4 }}
  {{- with .Values.relay.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.relay.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.relay.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.relay.ingress.host | quote }}
      http:
        paths:
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: {{ include "sayso.name" . }}-relay
                port: { number: {{ .Values.service.port }} }
{{- end }}
{{- end }}
