{{- if .Values.temporalUi.enabled }}
# The read-only Temporal UI. The API proxies /temporal to it for admins (D-21).
# It has a ClusterIP Service only and never an Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sayso.name" . }}-temporal-ui
  labels:
    {{- include "sayso.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: temporal-ui
  template:
    metadata:
      labels:
        {{- include "sayso.labels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal-ui
          image: {{ .Values.temporalUi.image }}
          env:
            - { name: TEMPORAL_ADDRESS, value: {{ .Values.temporal.address | quote }} }
            - { name: TEMPORAL_UI_PUBLIC_PATH, value: /temporal }
            - { name: TEMPORAL_DISABLE_WRITE_ACTIONS, value: "true" }
          ports:
            - { name: http, containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sayso.name" . }}-temporal-ui
  labels:
    {{- include "sayso.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: temporal-ui
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
