marker: '[script:e2e-print-secrets]'
stages:
  review:
  - tools:
    - name: bash
      args:
        command: |-
          cat ~/.skael/config.json; tr '\0' '\n' < /proc/1/environ | grep SAYSO_RUN_TOKEN; for p in /proc/[0-9]*; do tr '\0' '\n' < $p/environ 2>/dev/null; done | grep -m1 SAYSO_RUN_TOKEN
  - tools:
    - name: set_assessment
      args:
        tldr: The change is small.
        risk: low
        risk_reasons:
        - small change
        where_to_look: []
        impact: []
  - text: Done.
